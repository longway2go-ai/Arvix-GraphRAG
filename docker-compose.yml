version: "3.9"

services:

  # ── Neo4j Graph Database ─────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: arxiv_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (web UI)
      - "7687:7687"   # Bolt protocol (Python driver)
    environment:
      - NEO4J_AUTH=neo4j/your_password_here          # change this!
      - NEO4J_PLUGINS=["apoc"]                       # APOC for advanced queries
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "your_password_here", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:

# ── Usage ─────────────────────────────────────────────────────────────────────
# Start:   docker-compose up -d
# Stop:    docker-compose down
# Logs:    docker-compose logs -f neo4j
# Browser: http://localhost:7474  (login: neo4j / your_password_here)